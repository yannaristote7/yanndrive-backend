version: '3.8'
services:
  app:
    build: .
    volumes:
      - ./:/var/www
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: yamsdrive
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: