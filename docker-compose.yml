version: '3.8'
services:
  app:
    build: .
    volumes:
      - ./:/var/www
    environment:
      # Surcharge le .env (configuré pour Laragon) à l'intérieur du conteneur
      DB_HOST: db
      DB_USERNAME: ${DOCKER_DB_USERNAME:-yamsdrive}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Définir DOCKER_DB_PASSWORD dans .env}
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: yamsdrive
      MYSQL_USER: ${DOCKER_DB_USERNAME:-yamsdrive}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:?Définir DOCKER_DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Définir DOCKER_DB_ROOT_PASSWORD dans .env}
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: